<div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-label="Căutare în site">
        <div class="search-panel">
            <div class="search-input-row">
                <i data-lucide="search" class="search-input-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Caută membri, evenimente, secțiuni…" autocomplete="off" spellcheck="false">
                <button class="search-close-btn hover-target" id="searchCloseBtn" aria-label="Închide căutarea">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="search-results" id="searchResults"></div>
            <div class="search-hint">
                <span><kbd>↑</kbd><kbd>↓</kbd> navighează</span>
                <span><kbd>Enter</kbd> selectează</span>
                <span><kbd>Esc</kbd> închide</span>
            </div>
        </div>
    </div>
